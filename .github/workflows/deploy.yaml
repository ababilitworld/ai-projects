name: Deploy to cPanel

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy Development
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://ai-dev.ecosurvgroup.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: Deploy development website
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SECRET_FTP_SERVER }}
          username: ${{ secrets.SECRET_FTP_USERNAME_AI_DEV }}
          password: ${{ secrets.SECRET_FTP_PASSWORD_AI_DEV }}
          port: ${{ secrets.SECRET_FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-development.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/phpunit.xml
            **/phpunit.xml.dist
            **/composer.phar
            **/*.log
            README.md

  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ai.ecosurvgroup.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install optimized production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --classmap-authoritative

      - name: Deploy production website
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SECRET_FTP_SERVER }}
          username: ${{ secrets.SECRET_FTP_USERNAME_AI_RELEASE }}
          password: ${{ secrets.SECRET_FTP_PASSWORD_AI_RELEASE }}
          port: ${{ secrets.SECRET_FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-production.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/phpunit.xml
            **/phpunit.xml.dist
            **/composer.phar
            **/*.log
            README.md